name: Test

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - name: Core behavior contracts
        run: npm test
      - name: Source and managed update compatibility
        run: npm run verify:source && npm run verify:update-boundary
      - name: Rehearse previous-stable update with candidate artifacts
        # The tag workflow verifies its production-signed artifacts instead.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run rehearse:update-hop && npm run verify:release-artifacts

  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - name: Installed runtime, update recovery and process shutdown
        run: npm run test:platform
