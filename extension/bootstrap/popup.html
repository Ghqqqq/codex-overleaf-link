<!doctype html>
<html lang="en" class="popup-minimal-root" data-popup-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Codex Overleaf Link</title>
    <link id="popup-styles" rel="stylesheet" href="../runtime/styles/popup.css">
  </head>
  <body class="popup-minimal">
    <!-- The popup body is drawn by the replaceable runtime (runtime/src/popup.js),
         so popup changes ship through normal updates. This shell only holds
         the fallback shown if the runtime cannot load. -->
    <main id="popup-shell" data-bootstrap-shell>
      <p class="popup-note">Codex Overleaf Link could not load its runtime. Rerun the installer, then reload the extension.</p>
    </main>
    <script src="../runtime/src/shared/compatibility.js"></script>
    <script src="../runtime/src/popup.js"></script>
    <script src="updateStatus.js"></script>
  </body>
</html>
